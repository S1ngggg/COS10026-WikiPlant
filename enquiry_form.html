        <h1>WikiPlant Enquiry Form</h1>
        <p>Ask any question you want about our website!</p>
        <form method= "post" action="mailto:106757438@students.swinburne.edu.my">
            <fieldset>
                <legend>User Information</legend>
                <label for="username">Username:</label>
                <input type="text" id="username" pattern="[A-za-z]+" required="required">
                <p>
                    <label for="firstname">First name:</label>
                    <input type="text" id="firstname" pattern="[A-Za-z]+" required="required">
                    <label for="lastname">Last name:</label>
                    <input type="text" id="lastname" pattern="[A-Za-z]+" required="required">
                </p>
            </fieldset>
			<fieldset>
			<legend>Questions</legend>
			<label >Which category you have question?</label>
			<select name="categories" required="required">
			<option value="" disabled selected>Please Select</option>
			<option>Families</option>
			<option>Genus</option>
			<option>Specis</option>
			<option>Others</option>
			</select>
			<br><br>
			<label for="description">Please write down your problem here:</label><br><br>
			<textarea id="description" name="problem_review" rows="4" cols="100" placeholder="wirte down your questions here..."></textarea>
			</fieldset>
			<button type="submit" value="submit">Submit</button>
			<button type="reset" value="reset">Clear Form </button>
			<br><br>
			<a href="">Back to home</a>
		
        </form>
